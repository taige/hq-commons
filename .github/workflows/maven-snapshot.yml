name: Deploy Snapshot to Github Packages and Aliyun

# 触发条件：在 develop 分支有推送时自动触发，支持手动触发
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [merged]  # 只在拉取请求被合并时触发
  workflow_dispatch: # 允许手动触发
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'

jobs:
  deploy-snapshot:

    runs-on: ubuntu-latest

    # 为工作流程中的每个作业设置权限
    permissions:
      contents: read    # 读取仓库内容
      packages: write   # 写入GitHub Packages

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
      ALIYUN_PACKAGES_SNAPSHOT_URL: ${{ vars.ALIYUN_PACKAGES_SNAPSHOT_URL }}

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}   # 使用指定的分支

      # 2. 设置 Java 17 环境并启用 Maven 缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'      # 自动缓存 Maven 依赖

      # 3. Configure Maven Settings
      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>aliyun-maven</id>
                <username>\${env.ALIYUN_USERNAME}</username>
                <password>\${env.ALIYUN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 4. 部署 SNAPSHOT 版本到GitHub Packages
      - name: Deploy SNAPSHOT to Github Packages
        run: mvn -B clean deploy

      # 5. 部署 SNAPSHOT 版本到阿里云效
      - name: Deploy SNAPSHOT to Aliyun Package
        run: |
          mvn -B package deploy:deploy -DskipTests -DaltSnapshotDeploymentRepository=aliyun-maven::default::$ALIYUN_PACKAGES_SNAPSHOT_URL
