#MySQL、Oracle的driver会自动根据url识别
jdbc.driver=com.mysql.jdbc.Driver
#url
jdbc.url=jdbc:mysql://127.0.0.1:3306/pay_new?useUnicode=true&characterEncoding=utf8
#连接数据库的user
jdbc.username=upay
#user对应的密码
#jdbc.password=S76lI!xP8W
jdbc.password=9n+M8LqP+zeUn0N3KvAoUA==
#jdbc.password_key=eyGDTxVGdmJW7YMYclvWzPMGct4j0syHAdWEB3luYCk=

#最小连接数
jdbc.min-connections=1
#最大连接数
jdbc.max-connections=5
#日志中记录连接池操作的详细信息(存、取、连接状态等)
jdbc.verbose=true
#打印SQL语句及执行时间
jdbc.print-sql=true
#连接最大闲置时间，达到该时间(秒)，连接会被检测(活动连接<=最小连接)或回收(活动连接>最小连接)
jdbc.idle-timeout-sec=10
#从池中获取连接的最大等待时间(毫秒)
jdbc.checkout-timeout-millisec=3000
