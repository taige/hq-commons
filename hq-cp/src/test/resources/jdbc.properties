jdbc.driver = com.jolbox.bonecp.MockJDBCDriver
jdbc.url = jdbc:mysql:url
jdbc.username = mockuser
jdbc.password = mockpassword
jdbc.verbose = true
jdbc.print-sql = true
jdbc.commit-on-close = true
jdbc.min-connections = 1
